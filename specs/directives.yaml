version: "13.0"
description: Defines requirements for @eliware/elera-client.
directives:
  - id: E-1323.0
    dos:
      - Keep public behavior in agreement with the package README.
      - Validate the package with npm test before commit.
    donts:
      - Do not expose secrets, tokens, or private data.
    examples:
      - "An application sets ELERA_API_URL and ELERA_API_TOKEN, then calls createDb()."
      - "Send a token in the Authorization header. Do not put it in a URL."
